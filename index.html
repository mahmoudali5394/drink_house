<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتالوج الطلبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F3;--sf:#fff;--ink:#172421;--mute:#5E6D68;--line:#DDE2DC;--ac:#0E6B57;--acx:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101715;--sf:#18221F;--ink:#E8EEEA;--mute:#9BAAA4;--line:#2A3834;--ac:#3CC2A0;--acx:#0b1512}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,Tahoma,sans-serif;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{padding:28px 16px 12px;max-width:900px;margin:auto}
h1{margin:0;font-size:1.9rem;font-weight:800;line-height:1.3}
header p{margin:4px 0 0;color:var(--mute)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar>div{max-width:900px;margin:auto}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools input,.tools select{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 12px;min-width:0}
.tools input{flex:1}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--mute);margin-inline-start:6px}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
main{max-width:900px;margin:auto;padding:8px 16px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tile{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;overflow:hidden;text-align:center;line-height:1.1}
.tile img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;line-height:1.4}
.meta{color:var(--mute);font-size:.85rem}
.pr{font-weight:800;color:var(--ac)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
.qty button{width:36px;height:36px;border:0;background:none;font-size:1.2rem;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:600}
.add{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:8px;height:38px;padding:0 16px;cursor:pointer;font-weight:600}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
.cartbar{position:fixed;inset:auto 0 0 0;background:var(--ac);color:var(--acx);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none}
.cartbar.on{display:block}
.cartbar button{all:unset;cursor:pointer;display:flex;justify-content:space-between;max-width:900px;margin:auto;font-weight:800;width:100%}
dialog{width:min(560px,100%);max-height:92vh;border:0;border-radius:14px;background:var(--bg);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
.dh button{border:0;background:none;font-size:1.4rem;cursor:pointer}
.dl{padding:0 16px}.dl .row{grid-template-columns:1fr auto}
.fm{padding:12px 16px 16px;display:grid;gap:8px}
.fm input,.fm textarea{width:100%;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 12px}
.tot{display:flex;justify-content:space-between;font-weight:800;padding:12px 16px;border-top:1px solid var(--line)}
.send{margin:0 16px 16px;width:calc(100% - 32px);border:0;border-radius:10px;background:var(--ac);color:var(--acx);height:46px;font-weight:800;cursor:pointer}
.warn{color:#B3261E;padding:0 16px;font-size:.9rem}
@media(prefers-reduced-motion:no-preference){.cartbar{transition:transform .2s}}
</style>
</head>
<body>
<header><h1 id="store"></h1><p id="tag"></p></header>
<div class="bar"><div>
 <div class="tools"><input id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث"><select id="type" aria-label="النوع"></select></div>
 <div class="rail" id="rail"></div>
</div></div>
<main id="list"></main>
<div class="cartbar" id="cb"><button id="open"><span id="cc"></span><span id="ct"></span></button></div>
<dialog id="dlg">
 <div class="dh"><span>مراجعة الطلب</span><button id="x" aria-label="إغلاق">×</button></div>
 <div class="dl" id="items"></div>
 <div class="tot"><span>الإجمالي</span><span id="sum"></span></div>
 <div class="fm">
  <input id="biz" placeholder="اسم النشاط (كافيه / فندق / مطعم)" required>
  <input id="adr" placeholder="العنوان في الغردقة">
  <textarea id="note" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
 </div>
 <div class="warn" id="warn"></div>
 <button class="send" id="send">إرسال الطلب عبر واتساب</button>
</dialog>
<script>
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString("ar-EG");
let C={},P=[],cart={},brand="الكل",type="",term="";
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)%360;
const tile=p=>p.image?`<div class="tile"><img src="${p.image}" alt="" loading="lazy"></div>`:`<div class="tile" style="background:hsl(${hue(p.brand)} 45% 36%)">${p.brand}</div>`;
const price=p=>C.showPrices?`${fmt(p.price)} ${C.currency}`:"";
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");

function rail(){
  const n={};P.forEach(p=>n[p.brand]=(n[p.brand]||0)+1);
  const b=Object.entries(n).sort((a,b)=>b[1]-a[1]);
  $("#rail").innerHTML=[["الكل",P.length],...b].map(([k,v])=>`<button class="chip" aria-pressed="${k===brand}" data-b="${k}">${k}<small>${v}</small></button>`).join("");
  const t=[...new Set(P.map(p=>p.type).filter(Boolean))];
  $("#type").innerHTML=`<option value="">كل الأنواع</option>`+t.map(x=>`<option>${x}</option>`).join("");
}
function qty(id){const q=cart[id]||0;return q?`<div class="qty"><button data-m="${id}" aria-label="إنقاص">−</button><span>${fmt(q)}</span><button data-a="${id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-a="${id}">أضف</button>`}
function list(){
  const t=norm(term),r=P.filter(p=>(brand==="الكل"||p.brand===brand)&&(!type||p.type===type)&&(!t||norm(p.name).includes(t)));
  $("#list").innerHTML=r.length?r.map(p=>`<div class="row" id="r${p.id}">${tile(p)}<div><div class="nm">${p.name}</div><div class="meta">${p.brand}${p.type?" • "+p.type:""}</div>${C.showPrices?`<div class="pr">${price(p)}</div>`:""}</div><div data-q="${p.id}">${qty(p.id)}</div></div>`).join(""):`<div class="empty">مفيش منتجات مطابقة. جرّب كلمة تانية أو اختر «الكل».</div>`;
}
const total=()=>P.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function bar(){const c=count();$("#cb").classList.toggle("on",c>0);$("#cc").textContent=`عرض الطلب (${fmt(c)} صنف)`;$("#ct").textContent=C.showPrices?`${fmt(total())} ${C.currency}`:""}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];save();bar();
  const el=document.querySelector(`[data-q="${id}"]`);if(el)el.innerHTML=qty(id);if($("#dlg").open)review()}
function review(){
  const r=P.filter(p=>cart[p.id]);
  $("#items").innerHTML=r.map(p=>`<div class="row"><div><div class="nm">${p.name}</div><div class="meta">${price(p)}</div></div><div>${qty(p.id)}</div></div>`).join("")||`<div class="empty">الطلب فاضي.</div>`;
  $("#sum").textContent=C.showPrices?`${fmt(total())} ${C.currency}`:`${fmt(count())} صنف`;
  $("#warn").textContent=C.minOrder&&total()<C.minOrder?`الحد الأدنى للطلب ${fmt(C.minOrder)} ${C.currency}`:"";
}
function send(){
  const biz=$("#biz").value.trim();
  if(!biz){$("#warn").textContent="اكتب اسم النشاط الأول.";$("#biz").focus();return}
  if(C.minOrder&&total()<C.minOrder)return review();
  const d=new Date(),no=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.floor(Math.random()*9000+1000)}`;
  const lines=P.filter(p=>cart[p.id]).map(p=>`- ${p.name} × ${cart[p.id]}`+(C.showPrices?` = ${p.price*cart[p.id]} ${C.currency}`:""));
  const msg=[`طلب جديد #${no}`,`النشاط: ${biz}`,$("#adr").value.trim()?`العنوان: ${$("#adr").value.trim()}`:null,"",...lines,"",C.showPrices?`الإجمالي: ${total()} ${C.currency}`:null,$("#note").value.trim()?`ملاحظات: ${$("#note").value.trim()}`:null].filter(x=>x!==null).join("\n");
  window.open(`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.b){brand=t.dataset.b;rail();list()}
  else if(t.dataset.a)change(t.dataset.a,1);
  else if(t.dataset.m)change(t.dataset.m,-1);
});
$("#q").oninput=e=>{term=e.target.value;list()};
$("#type").onchange=e=>{type=e.target.value;list()};
$("#open").onclick=()=>{review();$("#dlg").showModal()};
$("#x").onclick=()=>$("#dlg").close();
$("#send").onclick=send;
Promise.all([fetch("data/config.json"),fetch("data/products.json")].map(p=>p.then(r=>r.json()))).then(([c,p])=>{
  C=c;P=p;document.title=c.storeName;$("#store").textContent=c.storeName;$("#tag").textContent=c.tagline+(c.deliveryNote?" • "+c.deliveryNote:"");
  Object.keys(cart).forEach(id=>{if(!P.some(p=>p.id===id))delete cart[id]});
  rail();list();bar();
}).catch(()=>{$("#list").innerHTML=`<div class="empty">تعذّر تحميل المنتجات. افتح الموقع من رابط GitHub Pages وليس من الملف مباشرة.</div>`});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drink House</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--sf:#fff;--ink:#14233A;--mute:#5F6F85;--line:#DCE4EC;--bl:#0B6FB8;--bd:#084E85;--rd:#D62A1E;--or:#F5A01A}
@media(prefers-color-scheme:dark){:root{--bg:#0D141D;--sf:#162130;--ink:#E7EEF6;--mute:#9AABC0;--line:#263649;--bl:#2E95E0;--bd:#0B2A47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Cairo,Tahoma,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.top{background:var(--bd);color:#fff;font-size:.85rem;text-align:center;padding:4px 12px}
header{background:var(--sf);border-bottom:3px solid var(--or);position:sticky;top:0;z-index:6}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.hd img{width:52px;height:52px;flex:none}
.hd h1{margin:0;font-size:1.15rem;font-weight:800;color:var(--bl);line-height:1.2}
.hd small{display:block;color:var(--mute);font-weight:400;font-size:.75rem}
.hd input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 18px}
.hd input:focus{border-color:var(--bl);outline:0}
.cartb{position:relative;border:0;background:var(--rd);color:#fff;border-radius:999px;height:44px;padding:0 16px;font-weight:800;cursor:pointer;flex:none}
.cartb b{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--or);color:#14233A;border-radius:99px;min-width:22px;height:22px;font-size:.8rem;display:none;place-items:center}
.wrap{max-width:1100px;margin:auto;padding:0 16px 40px}
h2{font-size:1.1rem;font-weight:800;margin:22px 0 10px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.strip>*{scroll-snap-align:start;flex:none}
.pr{height:230px;border-radius:12px;display:block;border:0;padding:0;cursor:pointer;background:none}
.pr img{height:100%;width:auto;border-radius:12px;display:block}
.bt{width:92px;text-align:center;border:0;background:none;cursor:pointer;padding:0}
.bt i{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 4px;border-radius:50%;color:#fff;font-style:normal;font-weight:800;font-size:.8rem;border:3px solid var(--sf);box-shadow:0 0 0 2px var(--line);line-height:1.1;padding:4px}
.bt span{font-size:.85rem;font-weight:600;display:block;line-height:1.3}
.bt[aria-pressed=true] i{box-shadow:0 0 0 3px var(--rd)}
.bt[aria-pressed=true] span{color:var(--rd)}
.sel{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sel select{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:6px 10px}
.sel span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:1;display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;line-height:1.2;overflow:hidden}
.im:not(:has(img)){padding:8px}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:600;font-size:.92rem;line-height:1.4;min-height:2.6em}
.mt{color:var(--mute);font-size:.78rem}
.px{font-weight:800;font-size:1.1rem;color:var(--rd);margin-top:auto}
.add{border:0;border-radius:8px;background:var(--bl);color:#fff;height:40px;font-weight:800;cursor:pointer;width:100%}
.qty{display:flex;align-items:center;justify-content:space-between;height:40px;border:2px solid var(--bl);border-radius:8px}
.qty button{width:40px;height:100%;border:0;background:none;font-size:1.3rem;font-weight:800;cursor:pointer;color:var(--bl)}
.qty span{font-weight:800}
.empty{padding:40px 0;text-align:center;color:var(--mute);grid-column:1/-1}
footer{background:var(--bd);color:#fff;padding:20px 16px 90px;text-align:center;font-size:.9rem;line-height:1.9}
dialog{margin:0;margin-inline-end:auto;height:100%;max-height:100%;width:min(440px,100%);border:0;background:var(--bg);color:var(--ink);padding:0}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bd);color:#fff;font-weight:800}
.dh button{border:0;background:none;color:#fff;font-size:1.6rem;cursor:pointer}
.body{flex:1;overflow:auto;padding:0 16px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it .qty{width:112px;flex:none}
.fm{display:grid;gap:8px;padding:12px 0}
.fm input,.fm textarea{width:100%;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 12px}
.ft{padding:12px 16px;border-top:1px solid var(--line);background:var(--sf)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-bottom:8px}
.warn{color:var(--rd);font-size:.9rem;min-height:1.4em}
.send{width:100%;border:0;border-radius:10px;background:#1FA855;color:#fff;height:48px;font-weight:800;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="top" id="topbar"></div>
<header><div class="hd">
 <img id="logo" alt="" src="logo.png"><h1 id="store">Drink House<small id="sub"></small></h1>
 <input id="q" type="search" placeholder="ابحث عن منتج أو شركة..." aria-label="بحث">
 <button class="cartb" id="open" aria-label="السلة">السلة <b id="cc"></b></button>
</div></header>
<div class="wrap">
 <h2 id="h-pr" hidden>عروض وجديدنا</h2><div class="strip" id="pr"></div>
 <h2>تسوّق حسب الشركة</h2><div class="strip" id="rail"></div>
 <h2 id="ttl">كل المنتجات</h2>
 <div class="sel"><select id="type" aria-label="النوع"></select><span id="cnt"></span></div>
 <div class="grid" id="list"></div>
</div>
<footer id="foot"></footer>
<dialog id="dlg">
 <div class="dh"><span>سلة الطلب</span><button id="x" aria-label="إغلاق">×</button></div>
 <div class="body"><div id="items"></div>
  <div class="fm"><input id="biz" placeholder="اسم النشاط (كافيه / فندق / مطعم)"><input id="adr" placeholder="العنوان في الغردقة"><textarea id="note" rows="2" placeholder="ملاحظات (اختياري)"></textarea></div></div>
 <div class="ft"><div class="tot"><span>الإجمالي</span><span id="sum"></span></div><div class="warn" id="warn"></div><button class="send" id="send">إرسال الطلب عبر واتساب</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString("ar-EG");
let C={},P=[],cart={},brand="",type="",term="";
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)%360,col=s=>`hsl(${hue(s)} 50% 34%)`;
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const price=p=>C.showPrices?`${fmt(p.price)} ${C.currency}`:"";
const img=p=>p.image?`<div class="im"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>`:`<div class="im" style="background:${col(p.brand)}">${p.brand}</div>`;
function qty(id){const q=cart[id]||0;return q?`<div class="qty"><button data-m="${id}" aria-label="إنقاص">−</button><span>${fmt(q)}</span><button data-a="${id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-a="${id}">أضف للسلة</button>`}
function renderTop(){
  const n={};P.forEach(p=>n[p.brand]=(n[p.brand]||0)+1);
  $("#rail").innerHTML=Object.entries(n).sort((a,b)=>b[1]-a[1]).map(([k])=>`<button class="bt" data-b="${k}" aria-pressed="${k===brand}"><i style="background:${col(k)}">${k}</i><span>${k}</span></button>`).join("");
  const t=[...new Set(P.map(p=>p.type).filter(Boolean))];
  $("#type").innerHTML=`<option value="">كل الأنواع</option>`+t.map(x=>`<option${x===type?" selected":""}>${x}</option>`).join("");
}
function list(){
  const t=norm(term),r=P.filter(p=>(!brand||p.brand===brand)&&(!type||p.type===type)&&(!t||norm(p.name+" "+p.brand).includes(t)));
  $("#ttl").textContent=brand||"كل المنتجات";$("#cnt").textContent=`${fmt(r.length)} منتج`+(brand?" • اضغط على الشركة تاني لعرض الكل":"");
  $("#list").innerHTML=r.length?r.map(p=>`<div class="card">${img(p)}<div class="cb"><div class="nm">${p.name}</div><div class="mt">${p.brand}${p.type?" • "+p.type:""}</div>${C.showPrices?`<div class="px">${price(p)}</div>`:""}<div data-q="${p.id}">${qty(p.id)}</div></div></div>`).join(""):`<div class="empty">مفيش منتجات مطابقة. جرّب كلمة تانية.</div>`;
}
const total=()=>P.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0),count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function badge(){const c=count(),b=$("#cc");b.textContent=fmt(c);b.style.display=c?"grid":"none"}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];save();badge();
  document.querySelectorAll(`[data-q="${id}"]`).forEach(e=>e.innerHTML=qty(id));if($("#dlg").open)review()}
function review(){
  const r=P.filter(p=>cart[p.id]);
  $("#items").innerHTML=r.map(p=>`<div class="it"><div><div class="nm" style="min-height:0">${p.name}</div><div class="mt">${price(p)}</div></div>${qty(p.id)}</div>`).join("")||`<div class="empty">السلة فاضية. ضيف منتجات وارجع.</div>`;
  $("#sum").textContent=C.showPrices?`${fmt(total())} ${C.currency}`:`${fmt(count())} صنف`;
  $("#warn").textContent=C.minOrder&&total()<C.minOrder?`الحد الأدنى للطلب ${fmt(C.minOrder)} ${C.currency}`:"";
}
function send(){
  const biz=$("#biz").value.trim();
  if(!count()){$("#warn").textContent="السلة فاضية.";return}
  if(!biz){$("#warn").textContent="اكتب اسم النشاط الأول.";$("#biz").focus();return}
  if(C.minOrder&&total()<C.minOrder)return review();
  const d=new Date(),no=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.floor(Math.random()*9000+1000)}`;
  const lines=P.filter(p=>cart[p.id]).map(p=>`- ${p.name} × ${cart[p.id]}`+(C.showPrices?` = ${p.price*cart[p.id]} ${C.currency}`:""));
  const msg=[`طلب جديد #${no}`,`النشاط: ${biz}`,$("#adr").value.trim()?`العنوان: ${$("#adr").value.trim()}`:null,"",...lines,"",C.showPrices?`الإجمالي: ${total()} ${C.currency}`:null,$("#note").value.trim()?`ملاحظات: ${$("#note").value.trim()}`:null].filter(x=>x!==null).join("\n");
  window.open(`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank");
}
const jump=()=>$("#ttl").scrollIntoView({behavior:"smooth"});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.b!==undefined){brand=brand===t.dataset.b?"":t.dataset.b;renderTop();list();jump()}
  else if(t.dataset.p!==undefined){brand=t.dataset.p;renderTop();list();jump()}
  else if(t.dataset.a)change(t.dataset.a,1);
  else if(t.dataset.m)change(t.dataset.m,-1);
});
$("#q").oninput=e=>{term=e.target.value;list()};
$("#type").onchange=e=>{type=e.target.value;list()};
$("#open").onclick=()=>{review();$("#dlg").showModal()};
$("#x").onclick=()=>$("#dlg").close();
$("#send").onclick=send;
Promise.all([fetch("data/config.json"),fetch("data/products.json")].map(p=>p.then(r=>r.json()))).then(([c,p])=>{
  C=c;P=p;document.title=c.storeName;$("#store").firstChild.nodeValue=c.storeName;$("#sub").textContent=c.tagline.split(" ").slice(0,4).join(" ")+"...";
  $("#logo").src=c.logo;$("#topbar").textContent=[c.deliveryNote,c.phones&&c.phones[0]].filter(Boolean).join(" • ");
  $("#foot").innerHTML=`${c.storeName}<br>${c.address||""}<br>${(c.phones||[]).join(" • ")}`;
  if((c.banners||[]).length){$("#h-pr").hidden=false;$("#pr").innerHTML=c.banners.map(b=>`<button class="pr" ${b.brand?`data-p="${b.brand}"`:""} aria-label="عرض"><img src="${b.image}" alt="" loading="lazy"></button>`).join("")}
  Object.keys(cart).forEach(id=>{if(!P.some(p=>p.id===id))delete cart[id]});
  renderTop();list();badge();
}).catch(()=>{$("#list").innerHTML=`<div class="empty">تعذّر تحميل المنتجات. افتح الموقع من رابط GitHub Pages وليس من الملف مباشرة.</div>`});
</script>
</body>
</html>
